name: CI

on:
  pull_request:
    branches: [main, "milestone/**"]
  push:
    branches: [main, "milestone/**"]

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy src
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  workflow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workflow
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy src
      - run: uv run pytest

  e2e:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/cache@v6.1.0
        with:
          path: data/raw
          key: raw-${{ hashFiles('pipeline/src/pnw_health/config.py', 'pipeline/src/pnw_health/indicators.yaml') }}
      - name: Run pipeline
        working-directory: pipeline
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: uv run pnw-health run --root ..
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Build site
        working-directory: web
        run: npm run build
      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: E2E
        working-directory: web
        run: CI=1 npx playwright test
      - name: E2E, changed specs, CPU-throttled and repeated
        if: github.event_name == 'pull_request'
        working-directory: web
        run: |
          specs=$(git diff --relative --name-only "origin/${{ github.base_ref }}...HEAD" -- 'e2e/*.spec.ts')
          if [ -z "$specs" ]; then
            echo "No e2e specs changed."
          else
            echo "Throttled repeat: $specs"
            # shellcheck disable=SC2086
            E2E_CPU_THROTTLE=4 CI=1 npx playwright test $specs --repeat-each=3
          fi
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14

  ci:
    needs: [pipeline, web, workflow, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs to succeed
        run: |
          test "${{ needs.pipeline.result }}" = "success"
          test "${{ needs.web.result }}" = "success"
          test "${{ needs.workflow.result }}" = "success"
          test "${{ needs.e2e.result }}" = "success"
