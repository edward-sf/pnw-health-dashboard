<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PNW Health Atlas</title>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0f3b2c" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#06150f" />
    <meta name="description" content="County health across Washington, Oregon, Idaho and Alaska." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PNW Health Atlas" />
    <meta property="og:title" content="PNW Health Atlas" />
    <meta property="og:description" content="County health across Washington, Oregon, Idaho and Alaska." />
    <meta property="og:url" content="%VITE_SITE_ORIGIN%%BASE_URL%" />
    <meta property="og:image" content="%VITE_SITE_ORIGIN%%BASE_URL%og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PNW Health Atlas" />
    <meta name="twitter:description" content="County health across Washington, Oregon, Idaho and Alaska." />
    <meta name="twitter:image" content="%VITE_SITE_ORIGIN%%BASE_URL%og-image.png" />
    <script src="%BASE_URL%spa-redirect.js"></script>
    <script>
      (function () {
        var url = spaRedirect.decode(location.search, "%BASE_URL%");
        if (url !== null) history.replaceState(null, "", url);
      })();
    </script>
    <!-- The theme, before first paint so a dark page never flashes light. Keep in step with
         src/theme/theme.ts (STORAGE_KEY, readChoice, resolveTheme). -->
    <script>
      (function () {
        var c = "system";
        try { c = localStorage.getItem("pnw-theme") || "system"; } catch (e) {}
        var dark = c === "dark" || (c !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
