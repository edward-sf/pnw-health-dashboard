<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PNW Health Dashboard</title>
    <script src="%BASE_URL%spa-redirect.js"></script>
    <script>
      (function () {
        var url = spaRedirect.decode(location.search, "%BASE_URL%");
        if (url !== null) history.replaceState(null, "", url);
      })();
    </script>
    <!-- The theme, before first paint so a dark page never flashes light. Keep in step with
         src/theme/theme.ts (STORAGE_KEY, readChoice, resolveTheme). -->
    <script>
      (function () {
        var c = "system";
        try { c = localStorage.getItem("pnw-theme") || "system"; } catch (e) {}
        var dark = c === "dark" || (c !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
