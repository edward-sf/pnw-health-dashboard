[project]
name = "wf"
version = "0.1.0"
description = "Orchestrated workflow graph runner for the PNW health dashboard"
authors = [
    { name = "Edward Simpson-Fitzgibbon", email = "edward.psf@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
wf = "wf.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
